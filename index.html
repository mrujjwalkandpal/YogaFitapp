const mm=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),tot=r=>r[7].reduce((a,p)=>a+p[1],0),mn=r=>Math.round(tot(r)/60),pd=id=>R.find(r=>r[0]==id),cn=id=>(C.find(c=>c[0]==id)||[0,'–'])[1];
const pill=r=>`${mn(r)} min · ${r[5]} · ${cn(r[2])}`;
const draw=id=>{const p=P[id],[hx,hy,sx,sy,px,py,arm,leg,bd=0,dc='']=p[6],ch=(o,l)=>l.map(([a,b,c,d])=>`M${o[0]} ${o[1]}L${a} ${b}L${c} ${d}${d>111?'l9 0':''}`).join('');
return `<svg class="fig" viewBox="0 0 200 130" role="img" aria-label="${p[0]} illustration"><rect x="24" y="119" width="152" height="4" rx="2" fill="var(--mut)" opacity=".3"/>${dc}<g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="${ch([px,py],leg)}" stroke="var(--g)" stroke-width="9"/><path d="M${sx} ${sy}Q${(sx+px)/2} ${(sy+py)/2-bd} ${px} ${py}" stroke="var(--g)" stroke-width="11"/><path d="${ch([sx,sy],arm)}" stroke="var(--g2)" stroke-width="6"/></g><circle cx="${hx}" cy="${hy}" r="8.5" fill="var(--g)"/></svg>`};
const week=()=>{const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7)).getTime(),a=Array(7).fill(0);st.h.forEach(x=>{if(x.ts>=m)a[(new Date(x.ts).getDay()+6)%7]+=x.d});return a};
const bars=a=>{const mx=Math.max(...a,60);return `<div class="wk">${a.map((v,i)=>`<div><i${v?'':' class="z"'} style="height:${Math.max(4,v/mx*56)}px"></i>${'MTWTFSS'[i]}</div>`).join('')}</div>`};
const streak=()=>{const s=new Set(st.h.map(x=>new Date(x.ts).toDateString())),d=new Date();let n=0;if(!s.has(d.toDateString()))d.setDate(d.getDate()-1);while(s.has(d.toDateString())){n++;d.setDate(d.getDate()-1)}return n};
const rcard=r=>`<button class="card row" ${D('pv',r[0])}><span class="th">${draw(r[6])}</span><span><b>${r[1]}</b><br><span class="mut">${r[3]}</span><br><span class="pill">${pill(r)}</span></span></button>`;
const hrow=x=>`<div class="card ex"><b>${x.t}</b><em>${new Date(x.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${Math.max(1,Math.round(x.d/60))} min</em></div>`;

const home=()=>{const n=new Date(),h=n.getHours(),d=R[Math.floor(n/864e5)%R.length],rs=st.rs&&pd(st.rs.id),w=week(),sum=Math.round(w.reduce((a,b)=>a+b,0)/60),rec=st.h.slice(-3).reverse();
return `<div class="top"><div><p class="mut">${n.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</p><h1>${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}</h1><p class="mut">Move gently. Breathe fully.</p></div><button class="ibtn" aria-label="Settings" ${D('tab','set')}>${I('set')}</button></div>
${rs?`<h2 class="sec" style="margin-top:0">Continue where you left off</h2><button class="card row" style="margin-bottom:20px" ${D('resume')}><span class="th">${draw(rs[7][st.rs.i][0])}</span><span><b>${rs[1]}</b><br><span class="pill">Next: ${P[rs[7][st.rs.i][0]][0]} · exercise ${st.rs.i+1} of ${rs[7].length}</span></span></button>`:''}<div class="card hero" role="button" ${D('pv',d[0])}>${draw(d[6])}<div><p class="pill">Your daily reset</p><h2>${d[1]}</h2><p class="mut">${d[3]}</p><p class="pill" style="margin-top:6px">${pill(d)}</p></div><button class="btn" ${D('start',d[0])}>Start Workout</button></div>
<h2 class="sec">Categories</h2><div class="grid">${C.map(c=>`<button class="card cat" style="--h:${c[3]}" ${D('cat',c[0])}>${draw(c[4])}<b>${c[1]}</b><span class="mut">${c[2]}</span><span class="pill">10 min · ${R.filter(r=>r[2]==c[0]).length} routines</span></button>`).join('')}</div>
<h2 class="sec">This week</h2><div class="card pad">${bars(w)}<p class="mut" style="margin-top:10px">${sum?sum+' min of yoga so far':'Complete a session to start your week.'}</p></div>
${rec.length?`<h2 class="sec">Recently completed</h2><div class="list" style="margin-top:0">${rec.map(hrow).join('')}</div>`:''}
<h2 class="sec">Daily tip</h2><div class="card pad"><p>${T[n.getDay()]}</p></div>`};
const lst=()=>{const k=q.trim().toLowerCase(),l=R.filter(r=>(cat=='all'||r[2]==cat)&&(lv=='all'||r[5]==lv)&&(!k||(r[1]+r[3]+r[4]+cn(r[2])).toLowerCase().includes(k)));return l.map(rcard).join('')||'<p class="mut">No routines match your search.</p>'};
const explore=()=>`<h1>Explore</h1><input id="q" type="search" placeholder="Search routines" aria-label="Search routines"><div class="chips">${[['all','All'],...C].map(c=>`<button class="chip${cat==c[0]?' on':''}" ${D('cat',c[0])}>${c[1]}</button>`).join('')}</div><div class="chips" style="margin-top:8px">${['all','Beginner','Intermediate'].map(l=>`<button class="chip${lv==l?' on':''}" ${D('lv',l)}>${l=='all'?'Any level':l}</button>`).join('')}</div><div class="list" id="list">${lst()}</div>`;
const prog=()=>{const h=st.h;if(!h.length)return `<h1>Progress</h1><div class="card empty" style="margin-top:16px">${draw('mtn')}<h2>Your journey starts here</h2><p class="mut">Complete your first 10-minute session and your stats will show up here.</p><button class="btn" ${D('tab','explore')}>Find a workout</button></div>`;
const t=h.reduce((a,x)=>a+x.d,0),m={};h.forEach(x=>m[x.c]=(m[x.c]||0)+1);const f=Object.keys(m).sort((a,b)=>m[b]-m[a])[0];
return `<h1>Progress</h1><div class="st" style="margin-top:16px">${[[h.length,'Workouts'],[Math.round(t/60),'Minutes'],[streak(),'Day streak'],[cn(f),'Top category']].map(s=>`<div class="card pad"><b class="big">${s[0]}</b><p class="mut">${s[1]}</p></div>`).join('')}</div><h2 class="sec">This week</h2><div class="card pad">${bars(week())}</div><h2 class="sec">History</h2><div class="list" style="margin-top:0">${h.slice(-30).reverse().map(hrow).join('')}</div>`};
const sett=()=>`<h1>Settings</h1><div class="card" style="margin-top:16px">${[['snd','Sound effects'],['hap','Haptic feedback']].map(([k,l])=>`<button class="tg" role="switch" aria-checked="${!!st.s[k]}" ${D('tg',k)}><span>${l}</span><i></i></button>`).join('')}</div><h2 class="sec">Theme</h2><div class="chips" style="margin:0;padding:0">${['auto','light','dark'].map(t=>`<button class="chip${st.s.th==t?' on':''}" ${D('th',t)}>${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div><h2 class="sec">Data</h2><button class="btn ghost" id="rs" ${D('reset')}>Reset progress</button><h2 class="sec">About</h2><div class="card pad"><p><b>YogaFlow</b> · guided 10-minute yoga. Your data stays on this device.</p><p class="mut" style="margin-top:8px">${SAFE}</p></div>`;
const view=a=>{const app=$('#app');app.innerHTML=({home,explore,prog,set:sett})[tab]();if(a){app.classList.remove('in');void app.offsetWidth;app.classList.add('in');scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>{const on=b.dataset.v==tab;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(tab=='explore')$('#q').value=q};

const pv=id=>{const r=pd(id);ov(`<div class="ses" role="dialog" aria-modal="true"><div class="sh"><button class="ibtn" aria-label="Close" ${D('close')}>${I('x')}</button><h2>${r[1]}</h2></div><div class="sb">${draw(r[6])}<p class="mut" style="margin:12px 0">${r[3]}</p><p><b>You’ll work on:</b> ${r[4]}</p><p class="pill">${pill(r)} · ${r[7].length} poses</p><div class="list">${r[7].map((p,i)=>`<div class="card ex"><span>${i+1}</span><b>${P[p[0]][0]}</b><em>${mm(p[1])}</em></div>`).join('')}</div><p class="mut note">${SAFE}</p></div><div class="dock"><button class="btn" style="flex:1;max-width:340px" ${D('start',r[0])}>Start Workout</button></div></div>`)};

/* session engine: timestamp-based, one rAF loop, catches up after backgrounding */
const beep=()=>{if(!st.s.snd||!ctx)return;try{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.frequency.value=587;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.15,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+.7);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.75)}catch(e){}};
const vib=()=>{if(st.s.hap&&navigator.vibrate)navigator.vibrate(60)};
const lock=async()=>{try{if(navigator.wakeLock&&ses&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}};
const unlock=()=>{try{wl&&wl.release()}catch(e){}wl=null};
document.addEventListener('visibilitychange',()=>{if(ses&&ses.i&&document.hidden){st.rs={id:ses.r[0],i:ses.i};save()}if(!document.hidden&&ses)lock()});
const left=()=>ses.pa?ses.rem:ses.end-Date.now();
const upd=()=>{const s=ses,l=Math.max(0,left()),pre=s.ph=='prep',before=s.r[7].slice(0,s.i).reduce((a,p)=>a+p[1]*1000,0);
$('#tm').textContent=pre?Math.ceil(l/1000):mm(Math.ceil(l/1000));$('#rg').style.strokeDashoffset=264*(1-l/s.len);$('#pb').style.width=Math.min(100,(before+(pre?0:s.len-l))/(tot(s.r)*1000)*100)+'%'};
const show=()=>{const s=ses,id=s.r[7][s.i][0],p=P[id],pre=s.ph=='prep';
ov(`<div class="ses" role="dialog" aria-modal="true"><div class="sh"><button class="ibtn" aria-label="Exit workout" ${D('exit')}>${I('x')}</button><div style="flex:1"><b>${s.r[1]}</b><p class="mut">Exercise ${s.i+1} of ${s.r[7].length}${pre?' · Get ready':''}</p></div></div><div class="bar"><i id="pb"></i></div>
<div class="sb">${draw(id)}<h2 style="margin-top:12px">${p[0]}</h2><p class="mut"><i>${p[1]}</i></p><p>${p[2]}</p><p class="br">${p[4]}</p><details><summary>How to do it</summary><ol>${p[3].map(x=>`<li>${x}</li>`).join('')}</ol></details><details><summary>Safety</summary><p>${p[5]}</p><p>${SAFE}</p></details></div>
<div class="dock"><div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--line)" stroke-width="7"/><circle id="rg" cx="50" cy="50" r="42" fill="none" stroke="var(--g)" stroke-width="7" stroke-linecap="round" stroke-dasharray="264"/></svg><b id="tm"></b></div><button class="sm" aria-label="Previous exercise" ${D('go',-1)}>${I('prev')}</button><button class="go" id="pp" aria-label="Pause" ${D('pp')}>${I('pause')}</button><button class="sm" aria-label="Next exercise" ${D('go',1)}>${I('next')}</button></div></div>`);upd()};
const adv=()=>{const s=ses;if(s.ph=='prep'){s.ph='run';s.len=s.r[7][s.i][1]*1000;s.end+=s.len;return}
beep();vib();s.dn++;if(s.i+1>=s.r[7].length)return fin();s.i++;s.ph='prep';s.len=3000;s.end+=3000};
const frame=()=>{cancelAnimationFrame(raf);const f=()=>{if(!ses)return;let n=0;if(!ses.pa)while(ses&&ses.end-Date.now()<=0){adv();n++}if(ses){if(n)show();else upd();raf=requestAnimationFrame(f)}};f()};
const start=(id,i=0)=>{const r=pd(id);try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}
ses={r,i,ph:'prep',len:3000,end:Date.now()+3000,pa:0,rem:0,pm:0,ps:0,dn:0,t0:Date.now()};lock();show();frame()};
const fin=()=>{const s=ses;ses=null;cancelAnimationFrame(raf);unlock();const d=Math.round((Date.now()-s.t0-s.pm)/1000);st.h.push({id:s.r[0],t:s.r[1],c:s.r[2],d,n:s.dn,ts:Date.now()});delete st.rs;save();
ov(`<div class="ses done" role="dialog" aria-modal="true"><div class="burst">${[0,1,2,3,4,5,6,7].map(i=>`<i style="--a:${i*45}deg"></i>`).join('')}${I('ok')}</div><h1>Workout complete</h1><p class="mut">${s.r[1]} · ${cn(s.r[2])}</p><div class="st"><div class="card pad"><b class="big">${mm(d)}</b><p class="mut">Total time</p></div><div class="card pad"><b class="big">${s.dn}/${s.r[7].length}</b><p class="mut">Poses completed</p></div></div><p>Beautifully done. Take a slow breath and notice how you feel.</p><button class="btn" ${D('start',s.r[0])}>Repeat workout</button><button class="btn ghost" ${D('home')}>Return home</button></div>`);view()};

const X={
tab:v=>{tab=v;view(1)},
cat:v=>{const a=tab!='explore';cat=v;tab='explore';view(a)},
pv,start,close:()=>ov(''),lv:v=>{lv=v;view()},
home:()=>{ov('');tab='home';view(1)},
tg:k=>{st.s[k]=st.s[k]?0:1;save();view()},
th:v=>{st.s.th=v;save();theme();view()},
reset:()=>{if(!rc){rc=1;$('#rs').textContent='Tap again to erase history';setTimeout(()=>{rc=0;const b=$('#rs');if(b)b.textContent='Reset progress'},4000)}else{rc=0;st.h=[];save();view()}},
pp:()=>{const s=ses,b=$('#pp');if(s.pa){s.pa=0;s.pm+=Date.now()-s.ps;s.end=Date.now()+s.rem;frame()}else{s.pa=1;s.ps=Date.now();s.rem=s.end-Date.now()}b.innerHTML=I(s.pa?'play':'pause');b.setAttribute('aria-label',s.pa?'Resume':'Pause')},
go:v=>{const s=ses,n=s.i+ +v;if(n<0)return;if(n>=s.r[7].length)return fin();if(s.pa){s.pm+=Date.now()-s.ps;frame()}s.i=n;s.ph='run';s.pa=0;s.len=s.r[7][n][1]*1000;s.end=Date.now()+s.len;show()},
exit:()=>{if(!ses.pa)X.pp();$('.ses').insertAdjacentHTML('beforeend','<div class="cf card"><h2>End this workout?</h2><p class="mut">Your progress won’t be saved.</p><button class="btn" data-a="end">End workout</button><button class="btn ghost" data-a="stay">Keep going</button></div>')},
stay:()=>$('.cf').remove(),
end:()=>{if(ses.i){st.rs={id:ses.r[0],i:ses.i};save()}ses=null;cancelAnimationFrame(raf);unlock();ov('');view()},resume:()=>start(st.rs.id,st.rs.i)};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&X[b.dataset.a])X[b.dataset.a](b.dataset.v)});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;$('#list').innerHTML=lst()}});
$('nav').innerHTML=[['home','Home'],['explore','Explore'],['prog','Progress'],['set','Settings']].map(([k,l])=>`<button ${D('tab',k)}>${I(k)}<span>${l}</span></button>`).join('');
const net=()=>{$('#off').hidden=navigator.onLine};addEventListener('online',net);addEventListener('offline',net);net();
theme();view();
</script><script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'))</script></body></html>
